<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>heart - Flash Card</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --border: #e5e7eb;
    --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .header {
    padding: 32px 36px 24px;
    background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
    color: #fff;
  }
  .word {
    margin: 0;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .phonetic {
    margin-top: 8px;
    font-size: 18px;
    opacity: 0.92;
    font-style: italic;
  }
  .body { padding: 28px 36px 36px; }
  .definition {
    font-size: 20px;
    line-height: 1.6;
    padding: 14px 16px;
    background: var(--accent-soft);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
  }
  .definition .pos {
    color: var(--accent);
    font-weight: 600;
    margin-right: 6px;
  }
  h2 {
    margin: 28px 0 14px;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .synonyms { display: flex; flex-wrap: wrap; gap: 10px; }
  .synonyms .tag {
    padding: 6px 14px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
  }
  .examples { list-style: none; padding: 0; margin: 0; }
  .examples li {
    padding: 14px 16px;
    margin-bottom: 10px;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .examples .en {
    font-size: 17px;
    line-height: 1.55;
  }
  .examples .zh {
    margin-top: 6px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.55;
  }
  .footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1 class="word">heart</h1>
      <div class="phonetic">/hɑːrt/</div>
    </div>
    <div class="body">
      <div class="definition">
        <span class="pos">n.</span>心脏；心；内心；中心
      </div>

      <h2>近义词</h2>
      <div class="synonyms">
        <span class="tag">core</span>
        <span class="tag">center</span>
        <span class="tag">soul</span>
      </div>

      <h2>例句</h2>
      <ul class="examples">
        <li><div class="en">Her heart beats fast when she sees him.</div><div class="zh">当她看到他时，她的心跳加速。</div></li>
        <li><div class="en">He has a kind heart and always helps others.</div><div class="zh">他心地善良，总是帮助别人。</div></li>
        <li><div class="en">The hotel is located in the heart of the city.</div><div class="zh">这家酒店位于市中心。</div></li>
      </ul>

      <div class="footer">Flash Card · 学一个词，记一组词</div>
    </div>
  </div>
</body>
</html>
